name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  rust:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@cfcaf53ba4c621917ec7f78a66bff7a8848ddad4 # 1.85.0
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install current stable Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # generic installer
        with:
          toolchain: stable
          components: clippy
      - name: Test on current stable Rust
        run: cargo test --locked
      - name: Clippy on current stable Rust
        run: cargo clippy --locked --all-targets --all-features
  wheels:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-2022, windows-11-arm, macos-15-intel, macos-15]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # generic installer
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
      - name: Build portable Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "v1.16.0"
          rust-toolchain: stable
          manylinux: "2_28"
          target: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          args: --release --locked --out dist -i python${{ matrix.python-version }}
      - name: Build native macOS or Windows wheel
        if: runner.os != 'Linux'
        run: uv build --wheel --no-sources --python ${{ matrix.python-version }} --out-dir dist
      - name: Install exact wheel in clean environment
        shell: bash
        run: |
          uv venv --python "${{ matrix.python-version }}" .artifact-venv
          uv pip install --python .artifact-venv --no-deps dist/*.whl
      - name: Test installed wheel outside checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pathlib,shutil; shutil.copytree(pathlib.Path(r'${{ github.workspace }}')/'tests',pathlib.Path('quadratic_form_tests'))"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -c "import fastlmmrslib; print(fastlmmrslib.__file__); assert '.artifact-venv' in fastlmmrslib.__file__"
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -m unittest discover -s quadratic_form_tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # generic installer
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
      - run: uv build --sdist --no-sources --out-dir dist
      - run: uv build --wheel --no-sources --python ${{ matrix.python-version }} --out-dir rebuilt dist/*.tar.gz
      - name: Test sdist-derived wheel
        shell: bash
        run: |
          uv venv --python "${{ matrix.python-version }}" .artifact-venv
          uv pip install --python .artifact-venv --no-deps rebuilt/*.whl
          cd "$RUNNER_TEMP"
          cp -r "$GITHUB_WORKSPACE/tests" quadratic_form_tests
          uv run --no-project --python "$GITHUB_WORKSPACE/.artifact-venv" python -m unittest discover -s quadratic_form_tests -v
      - name: Upload source distribution
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  distributions:
    name: Validate release distributions
    needs: [rust, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
      - name: Require all wheels and one source distribution
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          wheels = list(Path("dist").glob("*.whl"))
          sources = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 30, len(wheels)
          assert len(sources) == 1, len(sources)
          linux = [wheel for wheel in wheels if "manylinux" in wheel.name]
          assert len(linux) == 10, [wheel.name for wheel in linux]
          assert all("manylinux_2_28_" in wheel.name for wheel in linux)
          assert not any(wheel.name.rsplit("-", 1)[-1].startswith("linux_") for wheel in wheels)
          PYTHON
      - name: Validate metadata
        run: uv tool run --python 3.14 twine==7.0.0 check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastlmmrslib-distributions
          path: dist/*
          if-no-files-found: error
