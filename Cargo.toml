[package]
name = "fastlmmrslib"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0 AND BSD-2-Clause"
description = "Experimental reentrant Rust implementation of Davies' quadratic-form probabilities"
repository = "https://github.com/fastlmm/fastlmmrslib"
readme = "README.md"
include = ["src/**", "examples/**", "python/**", "tests/**", "Cargo.toml", "Cargo.lock", "pyproject.toml", "README.md", "LICENSE", "NOTICE.Davies", "ThirdPartyNotices.original.txt", "compare_legacy.py", "CHANGELOG.md", "RELEASING.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "=0.30.1", optional = true }

[dev-dependencies]
rayon = "1.12.0"

[lints.rust]
unsafe_code = "forbid"
